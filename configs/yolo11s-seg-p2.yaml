# YOLO11-seg + P2(stride 4) 헤드 — 분할용. 설치본의 p2 설정(v8/26)은 전부 탐지 전용이라 직접 만든다.
#
# 왜 필요한가: 기본 `yolo11-seg` 는 Segment(P3,P4,P5) 라 가장 촘촘한 격자가 stride 8 이다.
# imgsz 160 에서 부품이 3~14px 가 되어 격자보다 작아지고, 마스크는 그 1/4 해상도라 3px 가 된다.
# E6-1 에서 mask/box 비가 640 의 0.81 에서 160 의 0.33 으로 무너진 것이 이 지점이다.
#
# backbone 은 `yolo11-seg.yaml` 과 완전히 동일하다. head 에만 P2 갈래를 더했고,
# 연결 방식은 설치본 `v8/yolov8-p2.yaml` 의 순서를 그대로 따랐다(P2 백본 특징 = 2번 층).
#
# 주의: Segment 는 첫 입력(ch[0])으로 마스크 원형을 만든다. P2 를 첫 입력에 두면
# 원형 해상도가 imgsz/4 에서 imgsz/2 로 올라간다 — mask_ratio 를 함께 봐야 한다.

nc: 80
scales: # yolo11-seg 와 같은 계수
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2  <- P2 갈래가 여기서 갈린다
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Segment, [nc, 32, 256]] # Segment(P2, P3, P4, P5)
